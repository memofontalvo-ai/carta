<!DOCTYPE html>

<section id="login" class="loginbox" hidden>

    <div class="passw"><input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password" required><button type="button" id="ojo" class="ojo" aria-label="Mostrar contraseña" title="Mostrar contraseña">👁</button></div>
    <button class="b pri" type="submit">Entrar</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<div id="panel" hidden>
  <header class="bar">
    <strong class="cal">Panel de la carta</strong> <span class="mut verTxt" id="verBtn" style="cursor:pointer" title="Ver historial de versiones"></span>
    <span class="sp"></span>
    <span id="quien" class="mut"></span>
    <a class="b" href="index.html" target="_blank">Ver carta</a>
    <button class="b" id="salir">Salir</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="vista"></main>
</div>

<div class="ov" id="ov" hidden></div>
<div class="toast" id="toast"></div>
